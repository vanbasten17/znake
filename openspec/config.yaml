schema: spec-driven

# Project context — shown to AI when creating artifacts
context: |
  Project: znake — roguelite Snake prototype
  Tech stack: Phaser 3, Vite, TypeScript (strict), Biome
  Structure: src/game/{core,scenes,systems}, phaser.ts bootstrap
  Scenes: MenuScene, GameScene, UpgradeScene, DeathScene
  Conventions: pixel art rendering, mobile-first DOM HUD

# Per-artifact rules — all diagrams must be Mermaid, never ASCII
rules:
  proposal:
    - Use Mermaid diagrams (flowchart, sequenceDiagram) for workflows and flows — never ASCII
    - For architecture or state visuals, use Mermaid code blocks only
  design:
    - All diagrams MUST be Mermaid (flowchart, sequenceDiagram, stateDiagram, classDiagram, etc.) — never ASCII box drawings
    - Use ```mermaid blocks for system architecture, data flow, and component relationships
  tasks:
    - Use Mermaid diagrams when visualizing task dependencies or workflow — never ASCII
  specs:
    - Use Mermaid for scenario flows, state machines, or interaction sequences — never ASCII
