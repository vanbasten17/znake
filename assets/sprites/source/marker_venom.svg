<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Glow (Soft Green) -->
  <rect x="1.5" y="5.5" width="17" height="13" rx="1" fill="#39FF14" fill-opacity="0.3"/>
  <!-- Bottle Body (Dark Green) -->
  <rect x="2" y="6" width="16" height="12" rx="1.5" fill="#003300" stroke="#39FF14" stroke-width="1.5"/>
  <!-- Bottle Neck (Dark Green) -->
  <rect x="7" y="2" width="6" height="4" fill="#003300" stroke="#39FF14" stroke-width="1.5"/>
  <!-- Liquid / Bands (Middle Green) -->
  <rect x="4" y="14" width="12" height="2" fill="#006600"/>
  <!-- Skull Symbol (Neon Green circle + Dark dots) -->
  <circle cx="10" cy="12" r="3" fill="#39FF14"/>
  <circle cx="8.5" cy="11.5" r="0.6" fill="#003300"/>
  <circle cx="11.5" cy="11.5" r="0.6" fill="#003300"/>
  <rect x="9" y="13.5" width="2" height="1" fill="#003300"/>
</svg>
