<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#020208" />
    <title>Znake</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="hud">
      <div id="title-text">ZNAKE</div>
      <div id="stats-bar">
        <div class="stat"><span class="stat-label">RUN</span><span class="stat-val" id="run-num">1</span></div>
        <div class="stat"><span class="stat-label">SCORE</span><span class="stat-val" id="score-disp">0</span></div>
        <div class="stat"><span class="stat-label">FLOOR</span><span class="stat-val" id="floor-disp">1</span></div>
        <div class="stat"><span class="stat-label">KILLS</span><span class="stat-val" id="kills-disp">0</span></div>
      </div>
    </div>

    <div id="game-area">
      <div id="phaser-container"></div>
    </div>

    <div id="controls">
      <div id="dpad">
        <button class="dpad-btn" id="btn-up" data-dir="up" aria-label="Move up">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2.5"><polyline points="18 15 12 9 6 15" /></svg>
        </button>
        <button class="dpad-btn" id="btn-down" data-dir="down" aria-label="Move down">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2.5"><polyline points="6 9 12 15 18 9" /></svg>
        </button>
        <button class="dpad-btn" id="btn-left" data-dir="left" aria-label="Move left">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2.5"><polyline points="15 18 9 12 15 6" /></svg>
        </button>
        <button class="dpad-btn" id="btn-right" data-dir="right" aria-label="Move right">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2.5"><polyline points="9 18 15 12 9 6" /></svg>
        </button>
        <div id="dpad-center"></div>
      </div>

      <div id="right-controls">
        <button class="action-btn" id="btn-pause" aria-label="Pause game">
          <span class="btn-icon">II</span>
          <span>PAUSE</span>
        </button>
        <button class="action-btn" id="btn-start" aria-label="Start game">
          <span class="btn-icon">></span>
          <span>START</span>
        </button>
      </div>
    </div>

    <div id="hint-bar">SWIPE OR D-PAD TO MOVE - TAP START TO PLAY</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
